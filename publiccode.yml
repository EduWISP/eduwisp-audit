description:
  it:
    shortDescription: "EduWISP — Audit e reporting"
    longDescription: "Registro non alterabile delle operazioni amministrative e report minimizzati. Fa parte di EduWISP, piattaforma open source e gratuita per la gestione dei dispositivi digitali di proprietà delle scuole, con MDM, gestione scolastica, Family Control e prevenzione del cyberbullismo. Il progetto è in fase di progettazione e rispetta come vincolo bloccante il GDPR e la normativa italiana su privacy e minori. Documentazione: https://eduwisp.github.io/docs/"
    documentation: "https://eduwisp.github.io/docs/"
    features:
      - "Audit e reporting"
  en:
    shortDescription: "EduWISP — Audit & Reporting"
    longDescription: "Tamper-resistant log of administrative operations and minimised reports. Part of EduWISP, a free and open-source platform to manage school-owned digital devices, with MDM, school management, family control and cyberbullying prevention. The project is in the design phase and treats GDPR and Italian law on privacy and minors as a blocking constraint. Documentation: https://eduwisp.github.io/docs/en/"
    documentation: "https://eduwisp.github.io/docs/en/"
    features:
      - "Audit & Reporting"

